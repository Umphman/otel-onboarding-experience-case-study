name: otel-onboarding-case-study

services:
  app:
    build:
      context: .
    command: ["node", "--require", "./instrumentation/sdk/register.js", "./app/server.js"]
    environment:
      PORT: "8080"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-checkout-api}"
      OTEL_RESOURCE_ATTRIBUTES: "${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=otel-onboarding,deployment.environment.name=local,service.version=1.0.0}"
      OTEL_NODE_RESOURCE_DETECTORS: "env,host,os,serviceinstance"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_LOG_LEVEL: "info"
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      DEMO_SCENARIO: "normal"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  loadgen:
    build:
      context: .
    command: ["node", "./app/loadgen.js"]
    environment:
      BASE_URL: "http://app:8080"
      LOADGEN_REQUESTS: "10000"
      LOADGEN_INTERVAL_MS: "${LOADGEN_INTERVAL_MS:-1500}"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.19.2
    command:
      - run
      - --stability.level=experimental
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      OTLP_BACKEND_ENDPOINT: "http://lgtm:4318"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
      - "127.0.0.1:4318:4318"
    depends_on:
      lgtm:
        condition: service_healthy
    restart: unless-stopped

  lgtm:
    image: grafana/otel-lgtm:0.33.1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - lgtm-data:/data
    restart: unless-stopped

volumes:
  alloy-data:
  lgtm-data:
